<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102235">
<title>WorkProof Workspace — Product Prototype</title>
<style>
:root{--navy:#102235;--navy2:#19364a;--teal:#0f9f8f;--mint:#e9f8f1;--bg:#f4f7f6;--ink:#172c3b;--muted:#6d7f8b;--line:#e0e8e5;--white:#fff;--red:#b43d46;--amber:#9c6b12}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.demo{background:#fff3d9;color:#76510a;text-align:center;padding:8px 14px;font-size:12px;font-weight:750;border-bottom:1px solid #ecd9a7}.app{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 34px)}aside{background:var(--navy);color:#d5e0e6;padding:22px 15px;display:flex;flex-direction:column;gap:25px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px;color:white;padding:0 10px}.brand span{color:#68d8c2}.side-label{font-size:9px;letter-spacing:1.5px;color:#8fa6b4;font-weight:850;padding:0 10px;margin:3px 0 6px}.navlist{display:grid;gap:4px}.navitem{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#c4d2db;text-align:left;padding:10px;border-radius:9px;font-size:12px;font-weight:700}.navitem.active,.navitem:hover{background:#244457;color:white}.navitem .symbol{width:19px;text-align:center;font-size:15px}.sidebottom{margin-top:auto;border-top:1px solid #294354;padding-top:15px}.main{min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;gap:16px}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}.righttop{display:flex;align-items:center;gap:12px}.rolepick{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:var(--ink);font-size:12px;max-width:220px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:#087d70;display:grid;place-items:center;font-weight:900}.content{padding:28px;max-width:1300px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{font-size:10px;color:#0b8b79;text-transform:uppercase;letter-spacing:1.3px;font-weight:900}.pagehead h1{font-size:29px;line-height:1.2;letter-spacing:-1px;margin:5px 0 6px;color:var(--navy)}.pagehead p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;background:var(--teal);color:white;padding:10px 14px;font-size:12px;font-weight:850}.btn:hover{background:#087b70}.btn.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fff0f0;color:var(--red);border:1px solid #f1d1d2}.btn.small{padding:7px 10px;font-size:11px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.stat-label{color:var(--muted);font-size:11px;font-weight:700}.stat-value{font-size:28px;font-weight:900;letter-spacing:-1px;margin:8px 0 2px;color:var(--navy)}.stat-note{font-size:10px;color:#0b8b79}.layout2{grid-template-columns:1.4fr 1fr}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panelhead h2{font-size:15px;margin:0}.muted{color:var(--muted)}.smalltext{font-size:11px}.joblist{display:grid;gap:0}.jobrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf1ef}.jobrow:last-child{border:0}.jobtitle{font-size:12px;font-weight:850}.jobmeta{font-size:10px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;border-radius:30px;padding:4px 8px;font-size:9px;font-weight:850;white-space:nowrap;background:#eef3f2;color:#526772}.badge.green{background:#e3f7eb;color:#17764b}.badge.amber{background:#fff4d9;color:#8d6213}.badge.red{background:#ffe8e8;color:#a52e38}.activity{display:grid;gap:13px}.act{display:grid;grid-template-columns:25px 1fr;gap:9px}.acticon{width:25px;height:25px;border-radius:8px;background:var(--mint);color:#087d70;display:grid;place-items:center}.act b{font-size:11px;display:block}.act small{font-size:10px;color:var(--muted)}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 10px;min-width:130px;color:var(--ink);font-size:12px}.field.search{flex:1;min-width:190px}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:620px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf1ef;font-size:11px}.table th{color:#73838c;font-size:9px;text-transform:uppercase;letter-spacing:.8px}.table td strong{font-size:11px}.table tr:last-child td{border-bottom:0}.twocol{grid-template-columns:1fr 1fr}.passporthead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line)}.passporthead h2{font-size:19px;margin:3px 0}.passportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.minicard{background:#f5f8f7;border-radius:10px;padding:11px}.minicard small{display:block;color:var(--muted);font-size:9px}.minicard b{font-size:12px}.timeline{display:grid;gap:0}.timeitem{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ef}.timeitem:last-child{border:0}.timeicon{width:28px;height:28px;border-radius:9px;background:var(--mint);color:#087d70;display:grid;place-items:center}.timeitem b{display:block;font-size:11px}.timeitem p{font-size:11px;color:var(--muted);margin:3px 0}.timeitem small{font-size:9px;color:#82919a}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formfield{display:grid;gap:5px}.formfield.full{grid-column:1/-1}.formfield label{font-size:10px;font-weight:850;color:#5f717d}.formfield input,.formfield textarea,.formfield select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;font-size:12px;color:var(--ink)}.formfield textarea{min-height:80px;resize:vertical}.modalback{position:fixed;inset:0;background:#0b1b2acc;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modalback.open{display:flex}.modal{background:white;border-radius:16px;width:min(540px,100%);padding:22px;max-height:90vh;overflow:auto}.modal h2{font-size:19px;margin:0 0 6px}.modal p{font-size:12px;color:var(--muted)}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px 14px;background:#f1f8f5;border:1px solid #d9eee4;border-radius:10px;color:#446a5d;font-size:11px;margin-bottom:16px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.footerhint{font-size:10px;color:#81909a;margin-top:20px}.mobiletoggle{display:none}@media(max-width:920px){.app{grid-template-columns:70px 1fr}aside{padding:18px 9px}.brand{font-size:0;padding:0;text-align:center}.brand:first-letter{font-size:23px}.brand span{display:none}.side-label{display:none}.navitem{justify-content:center;padding:12px 4px;font-size:0}.navitem .symbol{font-size:16px}.sidebottom .navitem{font-size:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}.content{padding:20px}.topbar{padding:0 20px}}@media(max-width:580px){.app{grid-template-columns:1fr}aside{display:none}.topbar{height:auto;min-height:64px;padding:12px;flex-wrap:wrap}.content{padding:15px}.pagehead{flex-direction:column}.pagehead h1{font-size:25px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:24px}.twocol,.formgrid{grid-template-columns:1fr}.formfield.full{grid-column:auto}.rolepick{max-width:160px}.passportgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="demo">DEMO PROTOTYPE — sample data only. Actions are simulated in this browser and are not saved to a secure server.</div>
<div class="app">
<aside><div class="brand">Work<span>Proof</span></div><div><div class="side-label">WORKSPACE</div><div class="navlist" id="nav"></div></div><div class="sidebottom"><div class="side-label">ACCOUNT</div><button class="navitem" data-page="settings"><span class="symbol">⚙</span>Settings</button><button class="navitem" data-page="help"><span class="symbol">?</span>Help & support</button></div></aside>
<div class="main"><header class="topbar"><div class="crumb">Workspace / <b id="crumb">Overview</b></div><div class="righttop"><label for="rolepick" class="smalltext muted">Preview as</label><select id="rolepick" class="rolepick"><option value="owner">Business owner</option><option value="worker">Worker</option><option value="customer">Customer</option><option value="admin">Platform admin</option></select><div class="avatar" id="avatar">BO</div></div></header><main class="content" id="view"></main></div>
</div>
<div class="modalback" id="modalback" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="modal"><h2 id="modaltitle">Action</h2><p id="modaldesc"></p><div id="modalbody"></div><div class="modalactions"><button class="btn secondary" id="cancelmodal">Cancel</button><button class="btn" id="confirmmodal">Confirm</button></div></div></div>
<script>
const initialJobs=[
{id:'WP-1048',title:'Kitchen tap replacement',customer:'Lerato M.',worker:'Sipho N.',business:'ClearFlow Plumbing',price:'R 850.00',date:'14 Oct 2026',status:'In progress',progress:72,events:[['✓','Quote accepted','Customer accepted quote v1 · Sample event','09:10'],['↗','Progress update','Worker added a progress note · Sample event','10:25']]},
{id:'WP-1049',title:'Exterior wall repaint',customer:'David K.',worker:'Amira P.',business:'BrightCo Painting',price:'R 4,600.00',date:'16 Oct 2026',status:'Awaiting quote',progress:0,events:[['▤','Quote sent','Waiting for customer decision · Sample event','Yesterday']]},
{id:'WP-1050',title:'Bathroom leak inspection',customer:'Nomsa D.',worker:'Sipho N.',business:'ClearFlow Plumbing',price:'R 1,200.00',date:'18 Oct 2026',status:'Change requested',progress:40,events:[['✓','Original scope recorded','Initial agreement saved · Sample event','08:45'],['⇄','Change proposed','Additional pipe replacement needs review · Sample event','11:30']]}
];
const users=[
{id:'U-001',name:'Lerato Mokoena',email:'lerato@example.test',role:'Customer',status:'Active',joined:'02 Sep 2026'},
{id:'U-002',name:'ClearFlow Plumbing',email:'owner@clearflow.example.test',role:'Business owner',status:'Active',joined:'04 Sep 2026'},
{id:'U-003',name:'Sipho Ndlovu',email:'sipho@example.test',role:'Worker',status:'Active',joined:'06 Sep 2026'},
{id:'U-004',name:'Demo Suspended User',email:'suspended@example.test',role:'Customer',status:'Suspended',joined:'09 Sep 2026'}
];
let jobs=structuredClone(initialJobs),userRows=structuredClone(users),page='overview',activeJob='WP-1048',toastMessage='';
const navByRole={owner:[['overview','▦','Overview'],['jobs','▤','My jobs'],['quotes','R','Quotes & approvals'],['team','♙','Team'],['reports','▥','Reports']],worker:[['overview','▦','Overview'],['jobs','▤','Assigned jobs'],['passport','◷','Job Passport'],['updates','↗','Progress updates']],customer:[['overview','▦','Overview'],['jobs','▤','My jobs'],['passport','◷','Job Passport'],['quotes','R','Quotes & approvals'],['concerns','!','Concerns']],admin:[['overview','▦','Admin overview'],['users','♙','Users & businesses'],['jobs','▤','Job lookup'],['reports','⚑','Reports queue'],['audit','◷','Audit log'],['settings','⚙','Platform settings']],settings:[['settings','⚙','Settings']],help:[['help','?','Help & support']]};
function role(){return document.getElementById('rolepick').value}
function titleFor(p){return ({overview:'Overview',jobs:'Jobs',quotes:'Quotes & approvals',team:'Team management',reports:role()==='admin'?'Reports & complaints':'Reports',passport:'Job Passport',updates:'Progress updates',concerns:'Concerns',users:'Users & businesses',audit:'Admin audit log',settings:'Settings',help:'Help & support'})[p]||'Overview'}
function badge(status){let c=status==='Active'||status==='In progress'||status==='Completed'?'green':status==='Suspended'||status==='Urgent'?'red':'amber';return '<span class="badge '+c+'">'+esc(status)+'</span>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navRender(){const roleNav=navByRole[role()]||navByRole.owner;document.getElementById('nav').innerHTML=roleNav.map(([id,ic,label])=>'<button class="navitem '+(page===id?'active':'')+'" data-page="'+id+'"><span class="symbol">'+ic+'</span>'+label+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('crumb').textContent=titleFor(page);document.getElementById('avatar').textContent=({owner:'BO',worker:'WN',customer:'CU',admin:'AD'}[role()])}
function stats(items){return '<div class="grid stats">'+items.map(x=>'<div class="stat"><div class="stat-label">'+x[0]+'</div><div class="stat-value">'+x[1]+'</div><div class="stat-note">'+x[2]+'</div></div>').join('')+'</div>'}
function pagehead(kicker,title,desc,action=''){return '<div class="pagehead"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(action||'')+'</div>'}
function jobRows(list=jobs){if(role()==='worker')list=list.filter(j=>j.worker==='Sipho N.');if(role()==='customer')list=list.filter(j=>j.customer==='Lerato M.');if(role()==='owner')list=list.filter(j=>j.business==='ClearFlow Plumbing');return '<div class="joblist">'+(list.length?list.map(j=>'<div class="jobrow"><div><div class="jobtitle">'+esc(j.title)+'</div><div class="jobmeta">'+j.id+' · '+esc(j.customer)+' · '+esc(j.date)+'</div><div style="margin-top:7px">'+badge(j.status)+'</div></div><button class="btn secondary small" onclick="openJob(\''+j.id+'\')">Open record</button></div>').join(''):'<div class="empty">No jobs match this view.</div>')+'</div>'}
function overview(){let r=role();if(r==='admin')return pagehead('PLATFORM CONTROL','Good morning, admin.','Monitor safety, support and platform activity. Sample data only.','<button class="btn" onclick="go(\'users\')">Manage users</button>')+stats([['Registered accounts',userRows.length,'Sample directory'],['Active jobs',jobs.filter(j=>j.status!=='Completed').length,'Across demo records'],['Open reports','3','Illustrative queue'],['Pending appeals','1','Illustrative queue']])+'<div class="grid layout2"><section class="panel"><div class="panelhead"><h2>Needs attention</h2>'+badge('Review queue')+'</div><div class="joblist"><div class="jobrow"><div><div class="jobtitle">Privacy concern · WP-1050</div><div class="jobmeta">Review access and attachments</div></div>'+badge('Urgent')+'</div><div class="jobrow"><div><div class="jobtitle">Account appeal · U-004</div><div class="jobmeta">Review suspension reason and evidence</div></div>'+badge('Pending')+'</div><div class="jobrow"><div><div class="jobtitle">Support ticket · login help</div><div class="jobmeta">Awaiting a support response</div></div>'+badge('Open')+'</div></div></section><section class="panel"><div class="panelhead"><h2>Recent admin activity</h2><button class="btn secondary small" onclick="go(\'audit\')">View log</button></div><div class="activity"><div class="act"><span class="acticon">✓</span><span><b>Sample: account restored</b><small>Admin demo · today · reason required</small></span></div><div class="act"><span class="acticon">⚑</span><span><b>Sample: report assigned</b><small>Support queue · yesterday</small></span></div><div class="act"><span class="acticon">◷</span><span><b>Sample: privacy request received</b><small>Data request queue · yesterday</small></span></div></div></section></div><p class="footerhint">Admin permissions in this prototype are simulated. A production admin console must verify permissions on the server and record every sensitive action.</p>';
if(r==='customer')return pagehead('CUSTOMER SPACE','Know where your job stands.','Review agreements, follow progress and raise a concern when you need to.','<button class="btn" onclick="go(\'jobs\')">View my jobs</button>')+stats([['My jobs','2','Sample records'],['Waiting for you','1','Quote or change decision'],['In progress','1','Latest update today'],['Open concerns','0','No open sample concerns']])+'<div class="grid layout2"><section class="panel"><div class="panelhead"><h2>My jobs</h2><button class="btn secondary small" onclick="go(\'jobs\')">View all</button></div>'+jobRows()+'</section><section class="panel"><div class="panelhead"><h2>Your next steps</h2></div><div class="activity"><div class="act"><span class="acticon">R</span><span><b>Review the repaint quote</b><small>Check included work, exclusions, dates and total before deciding.</small></span></div><div class="act"><span class="acticon">⇄</span><span><b>Review proposed changes</b><small>Ask questions or approve/decline after checking cost and schedule impact.</small></span></div><div class="act"><span class="acticon">!</span><span><b>Need help?</b><small>You can raise a concern and keep a record of the response.</small></span></div></div></section></div>';
if(r==='worker')return pagehead('WORKER SPACE','Your assigned work, in one place.','Check the agreed scope, add updates and flag blockers before they become surprises.','<button class="btn" onclick="go(\'updates\')">Add progress update</button>')+stats([['Assigned jobs','2','Sample assignments'],['In progress','2','Keep records current'],['Changes to review','1','Ask the owner/customer'],['Updates this week','4','Sample activity']])+'<div class="grid layout2"><section class="panel"><div class="panelhead"><h2>Assigned jobs</h2></div>'+jobRows()+'</section><section class="panel"><div class="panelhead"><h2>Good job record habits</h2></div><div class="activity"><div class="act"><span class="acticon">✓</span><span><b>Follow the approved scope</b><small>If the job changes, record the proposal instead of assuming it is approved.</small></span></div><div class="act"><span class="acticon">↗</span><span><b>Add useful progress notes</b><small>Include what was done, what remains and any blockers.</small></span></div><div class="act"><span class="acticon">⇄</span><span><b>Ask before extra work</b><small>Record expected cost and schedule changes for approval.</small></span></div></div></section></div>';
return pagehead('BUSINESS WORKSPACE','Keep every job moving.','Quotes, team updates and customer records without searching through scattered chats.','<button class="btn" onclick="openModal(\'newjob\')">+ Create job</button>')+stats([['Active jobs',jobs.filter(j=>j.business==='ClearFlow Plumbing').length,'Across demo records'],['Awaiting decisions','2','Quote or change'],['Ready for review','1','Illustrative count'],['Team members','4','Sample business team']])+'<div class="grid layout2"><section class="panel"><div class="panelhead"><h2>Recent jobs</h2><button class="btn secondary small" onclick="go(\'jobs\')">View all</button></div>'+jobRows()+'</section><section class="panel"><div class="panelhead"><h2>Keep the record clear</h2></div><div class="activity"><div class="act"><span class="acticon">▤</span><span><b>Write down the full scope</b><small>Include exclusions and what the quote covers.</small></span></div><div class="act"><span class="acticon">⇄</span><span><b>Get change decisions on record</b><small>Show cost and schedule impact before doing extra work.</small></span></div><div class="act"><span class="acticon">✓</span><span><b>Close the loop</b><small>Invite a completion review and record any remaining concerns.</small></span></div></div></section></div>'}
function jobsPage(){let isAdmin=role()==='admin';return pagehead(isAdmin?'PLATFORM OVERSIGHT':'JOB MANAGEMENT',isAdmin?'Job lookup':'Your jobs',isAdmin?'Search records for a support case. Only authorized access should be allowed in production.':'Open a Job Passport to see the timeline, approved scope and next steps.',role()==='owner'?'<button class="btn" onclick="openModal(\'newjob\')">+ Create job</button>':'')+'<section class="panel"><div class="filters"><input class="field search" id="jobsearch" placeholder="Search job title, reference or participant…"><select class="field" id="jobstatus"><option value="">All statuses</option><option>In progress</option><option>Awaiting quote</option><option>Change requested</option><option>Completed</option></select></div><div id="jobtable">'+jobTable()+'</div></section>'}
function jobTable(){let q=(document.getElementById('jobsearch')?.value||'').toLowerCase(),s=document.getElementById('jobstatus')?.value||'';let list=jobs.filter(j=>(role()==='admin'||role()==='owner'&&j.business==='ClearFlow Plumbing'||role()==='worker'&&j.worker==='Sipho N.'||role()==='customer'&&j.customer==='Lerato M.')&&(!q||(j.title+' '+j.id+' '+j.customer+' '+j.worker).toLowerCase().includes(q))&&(!s||j.status===s));return '<div class="tablewrap"><table class="table"><thead><tr><th>Job</th><th>Customer</th><th>Worker</th><th>Agreed quote</th><th>Status</th><th></th></tr></thead><tbody>'+(list.length?list.map(j=>'<tr><td><strong>'+esc(j.title)+'</strong><div class="muted">'+j.id+' · '+j.date+'</div></td><td>'+esc(j.customer)+'</td><td>'+esc(j.worker)+'</td><td>'+j.price+'</td><td>'+badge(j.status)+'</td><td><button class="btn secondary small" onclick="openJob(\''+j.id+'\')">Open</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">No matching jobs.</td></tr>')+'</tbody></table></div>'}
function passport(){let j=jobs.find(j=>j.id===activeJob)||jobs[0];return pagehead('JOB PASSPORT','One record. Every important step.','This example shows how agreements, updates, changes and concerns should be organized.','<button class="btn secondary" onclick="go(\'jobs\')">← All jobs</button>')+'<section class="panel"><div class="passporthead"><div><div class="eyebrow">'+j.id+' · SAMPLE RECORD</div><h2>'+esc(j.title)+'</h2><div class="muted smalltext">'+esc(j.business)+' · '+esc(j.customer)+'</div></div>'+badge(j.status)+'</div><div class="passportgrid"><div class="minicard"><small>Quoted price</small><b>'+j.price+'</b></div><div class="minicard"><small>Planned date</small><b>'+j.date+'</b></div><div class="minicard"><small>Assigned worker</small><b>'+esc(j.worker)+'</b></div></div><div class="notice">Important: an approved quote is not silently replaced. Any material change should be recorded separately and approved by the required people.</div><div class="panelhead"><h2>Job timeline</h2><button class="btn" onclick="openModal(\'update\')">+ Add update</button></div><div class="timeline">'+j.events.map(e=>'<div class="timeitem"><span class="timeicon">'+e[0]+'</span><span><b>'+esc(e[1])+'</b><p>'+esc(e[2])+'</p><small>'+esc(e[3])+'</small></span></div>').join('')+'</div><div class="panelhead" style="margin-top:18px"><h2>Available actions</h2></div><div class="filters"><button class="btn secondary" onclick="openModal(\'change\')">Propose a change</button><button class="btn secondary" onclick="openModal(\'concern\')">Raise a concern</button><button class="btn secondary" onclick="toast(\'Demo export only: a real export will be generated from authorized server records.\')">Export record</button></div></section>'}
function quotes(){return pagehead('AGREEMENT REVIEW','Quotes and change decisions','Always check the version, scope, total and schedule before making a decision.')+'<div class="grid twocol"><section class="panel"><div class="panelhead"><h2>Quote waiting for a decision</h2>'+badge('Awaiting quote')+'</div><h3 style="font-size:15px">Exterior wall repaint</h3><p class="smalltext muted">WP-1049 · BrightCo Painting · Sample quote</p><div class="passportgrid"><div class="minicard"><small>Quote total</small><b>R 4,600.00</b></div><div class="minicard"><small>Planned date</small><b>16 Oct 2026</b></div></div><p class="smalltext">Before accepting, confirm included surfaces, paint/materials, preparation, exclusions, dates and payment terms.</p><div class="filters"><button class="btn" onclick="decision('WP-1049','Quote accepted')">Accept sample quote</button><button class="btn secondary" onclick="decision('WP-1049','Changes requested')">Ask for changes</button><button class="btn secondary" onclick="decision('WP-1049','Quote declined')">Decline</button></div></section><section class="panel"><div class="panelhead"><h2>Change request</h2>'+badge('Pending')+'</div><h3 style="font-size:15px">Bathroom leak inspection</h3><p class="smalltext muted">WP-1050 · Additional pipe replacement · Sample</p><p class="smalltext">Proposed price/time impact must be visible before approval. No approval is inferred from silence.</p><div class="filters"><button class="btn" onclick="decision('WP-1050','Change approved')">Approve sample change</button><button class="btn secondary" onclick="decision('WP-1050','Change declined')">Decline</button></div></section></div>'}
function usersPage(){return pagehead('ADMIN CONSOLE','Users & businesses','Search sample accounts, review status and test the moderation flow. This does not affect real accounts.','<button class="btn secondary" onclick="toast(\'Production admin actions require server-side authorization and audit logging.\')">Admin safeguards</button>')+'<section class="panel"><div class="filters"><input id="usersearch" class="field search" placeholder="Search name, email or ID…"><select id="userstatus" class="field"><option value="">All statuses</option><option>Active</option><option>Suspended</option></select></div><div id="usertable">'+userTable()+'</div></section><p class="footerhint">Production plan: require a reason, log the action, revoke sessions where needed, and offer a review/appeal process. Never delete an account just to hide a complaint or erase a job record.</p>'}
function userTable(){let q=(document.getElementById('usersearch')?.value||'').toLowerCase(),s=document.getElementById('userstatus')?.value||'';let list=userRows.filter(u=>(u.name+' '+u.email+' '+u.id).toLowerCase().includes(q)&&(!s||u.status===s));return '<div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Joined</th><th>Status</th><th>Demo actions</th></tr></thead><tbody>'+(list.length?list.map(u=>'<tr><td><strong>'+esc(u.name)+'</strong><div class="muted">'+esc(u.email)+' · '+u.id+'</div></td><td>'+esc(u.role)+'</td><td>'+u.joined+'</td><td>'+badge(u.status)+'</td><td>'+(u.status==='Active'?'<button class="btn danger small" onclick="userAction(\''+u.id+'\',\'Suspend\')">Suspend</button>':'<button class="btn secondary small" onclick="userAction(\''+u.id+'\',\'Restore\')">Restore</button>')+' <button class="btn secondary small" onclick="userAction(\''+u.id+'\',\'Review\')">Review</button></td></tr>').join(''):'<tr><td colspan="5" class="empty">No accounts found.</td></tr>')+'</tbody></table></div>'}
function reports(){return pagehead('TRUST & SAFETY','Reports and concerns','Treat reports as allegations to review—not automatic proof. Protect reporter privacy and record the outcome.')+'<section class="panel"><div class="filters"><select class="field"><option>All statuses</option><option>New</option><option>Investigating</option><option>Appealed</option></select><select class="field"><option>All severity</option><option>Urgent</option><option>Normal</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Case</th><th>Category</th><th>Reference</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td><strong>RP-021</strong><div class="muted">Received today</div></td><td>Privacy concern</td><td>WP-1050</td><td>'+badge('Urgent')+'</td><td><button class="btn secondary small" onclick="toast(\'Demo: case opened. Production case detail must be access-controlled.\')">Review</button></td></tr><tr><td><strong>RP-020</strong><div class="muted">Received yesterday</div></td><td>Inaccurate information</td><td>WP-1048</td><td>'+badge('Investigating')+'</td><td><button class="btn secondary small" onclick="toast(\'Demo: case opened.\')">Review</button></td></tr><tr><td><strong>RP-019</strong><div class="muted">Received 2 days ago</div></td><td>Impersonation concern</td><td>U-004</td><td>'+badge('Appealed')+'</td><td><button class="btn secondary small" onclick="toast(\'Demo: appeal opened.\')">Review</button></td></tr></tbody></table></div></section>'}
function audit(){return pagehead('ADMIN CONTROL','Admin audit log','A production log should be append-only and record actor, target, reason, timestamp and outcome.')+'<section class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Reason / case</th></tr></thead><tbody><tr><td>Today 10:42</td><td>Admin demo</td><td>Account restored</td><td>U-004</td><td>Appeal reviewed · Sample</td></tr><tr><td>Yesterday 15:18</td><td>Support demo</td><td>Report assigned</td><td>RP-021</td><td>Privacy queue · Sample</td></tr><tr><td>Yesterday 09:20</td><td>Admin demo</td><td>Privacy request opened</td><td>PR-007</td><td>Identity check pending · Sample</td></tr></tbody></table></div></section>'}
function generic(p){let isSettings=p==='settings';return pagehead(isSettings?'PREFERENCES':'SUPPORT',isSettings?'Settings':'Help & support',isSettings?'Profile and notification controls would live here in the production app.':'Get help with quotes, job records, account access or a privacy concern.')+'<div class="grid twocol"><section class="panel"><div class="panelhead"><h2>'+(isSettings?'Profile & notifications':'Contact support')+'</h2></div><div class="formgrid"><div class="formfield"><label>'+(isSettings?'Display name':'Your email')+'</label><input placeholder="'+(isSettings?'Your name':'you@example.com')+'"></div><div class="formfield"><label>'+(isSettings?'Preferred language':'Topic')+'</label><select><option>English</option><option>isiZulu</option><option>Sesotho</option><option>Afrikaans</option></select></div><div class="formfield full"><label>'+(isSettings?'Notification preferences':'How can we help?')+'</label><textarea placeholder="Write a short message…"></textarea></div></div><button class="btn" style="margin-top:13px" onclick="toast('Prototype only: settings and support messages are not saved.')">'+(isSettings?'Save demo preferences':'Preview support request')+'</button></section><section class="panel"><div class="panelhead"><h2>Important</h2></div><p class="smalltext muted">Real account, notification and support features require authentication, a secure database, permission checks, delivery configuration and a clear privacy policy. Do not enter real private information into this demo.</p><div class="notice">If you're reporting a security or privacy issue, the production version should route it to a restricted support queue with a case reference.</div></section></div>'}
function render(){if(!navByRole[role()]?.some(n=>n[0]===page))page='overview';navRender();let v=document.getElementById('view');v.innerHTML=page==='overview'?overview():page==='jobs'?jobsPage():page==='passport'?passport():page==='quotes'?quotes():page==='users'?usersPage():page==='reports'?reports():page==='audit'?audit():generic(page);if(page==='jobs'){document.getElementById('jobsearch').oninput=()=>document.getElementById('jobtable').innerHTML=jobTable();document.getElementById('jobstatus').onchange=()=>document.getElementById('jobtable').innerHTML=jobTable()}if(page==='users'){document.getElementById('usersearch').oninput=()=>document.getElementById('usertable').innerHTML=userTable();document.getElementById('userstatus').onchange=()=>document.getElementById('usertable').innerHTML=userTable()}}
function go(p){page=p;render()}
function openJob(id){activeJob=id;page='passport';render()}
function toast(msg){let old=document.getElementById('toast');if(old)old.remove();let el=document.createElement('div');el.id='toast';el.textContent=msg;el.style.cssText='position:fixed;bottom:20px;right:20px;max-width:380px;padding:14px 17px;background:#102235;color:white;border-radius:10px;box-shadow:0 10px 35px #0003;z-index:30;font-size:12px';document.body.appendChild(el);setTimeout(()=>el.remove(),4200)}
function openModal(type){let titles={newjob:'Create a sample job',update:'Add a sample progress update',change:'Propose a sample change',concern:'Raise a sample concern',user:'Confirm demo account action'};document.getElementById('modaltitle').textContent=titles[type]||'Confirm action';document.getElementById('modaldesc').textContent='Demo only: this will change temporary data in this page, not a real account or database.';let fields=type==='newjob'?'<div class="formgrid"><div class="formfield full"><label>Job title</label><input id="m-title" placeholder="e.g. Gate repair"></div><div class="formfield"><label>Customer name</label><input id="m-customer" placeholder="Customer"></div><div class="formfield"><label>Quote total</label><input id="m-price" placeholder="R 0.00"></div></div>':type==='update'?'<div class="formfield"><label>Progress note</label><textarea id="m-note" placeholder="What was done? What remains? Any blockers?"></textarea></div>':type==='change'?'<div class="formgrid"><div class="formfield full"><label>Reason and proposed work</label><textarea id="m-note" placeholder="Describe the change clearly"></textarea></div><div class="formfield"><label>Price impact</label><input id="m-price" placeholder="R 0.00 / no change"></div><div class="formfield"><label>Schedule impact</label><input id="m-date" placeholder="e.g. +1 day"></div></div>':'<div class="formfield"><label>Details</label><textarea id="m-note" placeholder="Describe the concern or action reason"></textarea></div>';document.getElementById('modalbody').innerHTML=fields;document.getElementById('modalback').dataset.type=type;document.getElementById('modalback').classList.add('open')}
function closeModal(){document.getElementById('modalback').classList.remove('open')}
function confirmModal(){let type=document.getElementById('modalback').dataset.type,note=document.getElementById('m-note')?.value.trim()||'';if(type==='newjob'){let title=document.getElementById('m-title').value.trim();if(!title){toast('Please enter a sample job title.');return}jobs.unshift({id:'WP-'+(1051+jobs.length),title,customer:document.getElementById('m-customer').value.trim()||'New customer',worker:'Sipho N.',business:'ClearFlow Plumbing',price:document.getElementById('m-price').value.trim()||'Not set',date:'Date to confirm',status:'Draft',progress:0,events:[['▤','Draft created','Created in local demo only','Just now']]});closeModal();page='jobs';render();toast('Sample job added to this page only. It will disappear on refresh.');return}let j=jobs.find(j=>j.id===activeJob)||jobs[0];if(type==='update'){if(!note){toast('Enter a sample progress note first.');return}j.events.unshift(['↗','Progress update',note,'Just now'])}if(type==='change'){if(!note){toast('Describe the proposed change first.');return}j.events.unshift(['⇄','Change proposed',note+' · Impact: '+(document.getElementById('m-price')?.value||'not set')+' · Schedule: '+(document.getElementById('m-date')?.value||'not set'),'Just now']);j.status='Change requested'}if(type==='concern'){if(!note){toast('Describe the sample concern first.');return}j.events.unshift(['!','Concern recorded',note,'Just now'])}closeModal();render();toast('Sample record updated in this browser only.')}
function decision(id,decisionText){let j=jobs.find(j=>j.id===id);if(j){j.events.unshift(['✓',decisionText, 'Sample decision in prototype only; no real consent was recorded.','Just now']);if(decisionText==='Quote accepted')j.status='Scheduled';if(decisionText==='Changes requested')j.status='Change requested';if(decisionText==='Quote declined')j.status='Quote declined';render();toast('Demo decision displayed only. No real agreement was accepted.')}}
function userAction(id,action){let u=userRows.find(u=>u.id===id);if(!u)return;if(action==='Review'){toast('Demo account review: '+u.id+'. Real account details must be permission-controlled.');return}document.getElementById('modaltitle').textContent=action+' account?';document.getElementById('modaldesc').textContent='You are changing only sample data. In production, this action must require an authorized admin, a reason, confirmation, audit logging and a review/appeal path.';document.getElementById('modalbody').innerHTML='<div class="formfield"><label>Required reason</label><textarea id="m-note" placeholder="Explain why this action is needed"></textarea></div>';document.getElementById('modalback').dataset.type='user';document.getElementById('modalback').dataset.user=id;document.getElementById('modalback').dataset.action=action;document.getElementById('modalback').classList.add('open')}
function finishUserAction(){let id=document.getElementById('modalback').dataset.user,action=document.getElementById('modalback').dataset.action,reason=document.getElementById('m-note')?.value.trim();if(!reason){toast('A reason is required, even in this demo.');return}let u=userRows.find(u=>u.id===id);if(u)u.status=action==='Suspend'?'Suspended':'Active';closeModal();render();toast('Sample status changed. A production system must log this securely.')}
document.getElementById('rolepick').addEventListener('change',()=>{page='overview';render()});
document.getElementById('cancelmodal').onclick=closeModal;
document.getElementById('confirmmodal').onclick=()=>document.getElementById('modalback').dataset.type==='user'?finishUserAction():confirmModal();
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
render();
</script>
</body>
</html>
